<!DOCTYPE html>

<head>

    <title>몬스타기어 | 제품 상세페이지</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="../images/favicon.png">
    <!-- webfont -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+KR:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- 통합 CSS -->
    <link rel="stylesheet" href="../../css/product/product01.css">
</head>

<body>
    <div id="wrap">
        <!-- ▣ HEADER -->
        <div id="header">
            <div class="header_inner">
                <h1 class="logo">
                    <a href="../../index.html">
                        <img src="../../images/main_imges/monstargear.png" alt="몬스타기어 로고">
                    </a>
                </h1>

                <nav id="nav">
                    <ul class="gnb">
                        <li><a href="../sub_01.html">제품 상세페이지</a></li>
                        <li><a href="../sub_02.html">패키지디자인</a></li>
                        <li><a href="../sub_03.html">배너디자인</a></li>
                        <li><a href="../sub_04.html">유튜브 썸네일</a></li>
                        <li><a href="../sub_05.html">기사 썸네일</a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- ▣ PRODUCT DETAIL -->
        <section id="product_detail">
            <div class="product-detail-container">
                <!-- 이미지 갤러리 -->
                <div class="product-gallery">
                    <div class="main-image">
                        <img id="mainPreview" src="../../images/product/pcgear/LIVE100/1.jpg" alt="메인 제품 이미지">
                    </div>
                    <div class="thumbnail-images">
                        <img src="../../images/product/pcgear/LIVE100/2.jpg" alt="썸네일2" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/3.jpg" alt="썸네일3" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/4.jpg" alt="썸네일4" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/5.jpg" alt="썸네일4" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/6.jpg" alt="썸네일4" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/7.jpg" alt="썸네일4" onclick="changeImage(this)">
                        <img src="../../images/product/pcgear/LIVE100/8.jpg" alt="썸네일4" onclick="changeImage(this)">
                    </div>
                </div>

                <!-- 텍스트 & 액션 -->
                <div class="product-info">
                    <h2 class="product-title">라이브100 스피커</h2>
                    <p class="product-price">₩19,000</p>
                    <p class="product-description">
                        감각적인 디자인과 풍부한 사운드를 갖춘 <strong>LED 사운드바 스피커</strong>입니다.<br>
                        6W 스테레오 출력으로 게임과 음악, 영상 콘텐츠를 생생하게 즐길 수 있으며,<br>
                        전면 RGB LED 조명과 핑크·오트밀 컬러로 책상 위 분위기까지 감각적으로 완성해 줍니다.
                    </p>

                    <div class="product-options">
                        <label for="switch-type">스피커</label>
                        <select id="switch-type" name="switch-type">
                            <option value="TS115">라이브100</option>
                        </select>
                    </div>

                    <div class="product-actions">
                        <button class="btn-cart" type="button">장바구니 담기</button>
                        <button class="btn-pay" type="button" >바로 구매하기</button>
                    </div>
                </div>
            </div>

            <!-- ▣ 상세페이지 이미지 (하단 전체 이미지) -->
            <div class="product-description-image">
                <div style="text-align: center;">

                    <img src="https://monstar.diskn.com/m7Yh4GQqjy" /><br>
                    <img src="https://monstar.diskn.com/I7Yh4GQzCb" /><br>
                    <img src="https://monstar.diskn.com/q7Yh4GQIHZ" /><br>
                    <img src="https://monstar.diskn.com/c7Yh4GQRP3" /><br>
                    <img src="https://monstar.diskn.com/e7Yh4GR1iL" /><br>
                    <img src="https://monstar.diskn.com/r7Yh4GVJ5k" /><br>
                    <img src="https://monstar.diskn.com/K7Yh4GW5la" /><br>
                    <img src="https://monstar.diskn.com/o7Yh4H1g8N" /><br>
                    <img src="https://monstar.diskn.com/x7Yh4H3PMb" /><br>
                    <img src="https://monstar.diskn.com/F7Yh4H4Fvz" />

        <div id="footer">
            <div class="link_address">
                <p class="footer_address">이 작업물은 몬스타기어 근무 기간 중 직접 제작에 참여한 결과물이며,</p>
                <p class="footer_address">포트폴리오 용도로 제작되었습니다.</p>
            </div>
        </div>
    </div>

    <script>
        function changeImage(elem) {
            document.getElementById('mainPreview').src = elem.src;
        }
    </script>
