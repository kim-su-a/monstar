<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1340">
    <title>몬스타기어 | 제품 상세페이지</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="../images/favicon.png">
    <!-- webfont -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+KR:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- 통합 CSS -->
    <link rel="stylesheet" href="../../css/product/product01.css">
</head>

<body>
    <div id="wrap">
        <!-- ▣ HEADER -->
        <div id="header">
            <div class="header_inner">
                <h1 class="logo">
                    <a href="../../index.html">
                        <img src="../../images/main_imges/monstargear.png" alt="몬스타기어 로고">
                    </a>
                </h1>

                <nav id="nav">
                    <ul class="gnb">
                        <li><a href="../sub_01.html">제품 상세페이지</a></li>
                        <li><a href="../sub_02.html">패키지디자인</a></li>
                        <li><a href="../sub_03.html">배너디자인</a></li>
                        <li><a href="../sub_04.html">유튜브 썸네일</a></li>
                        <li><a href="../sub_05.html">기사 썸네일</a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- ▣ PRODUCT DETAIL -->
        <section id="product_detail">
            <div class="product-detail-container">
                <!-- 이미지 갤러리 -->
                <div class="product-gallery">
                    <div class="main-image">
                        <img id="mainPreview" src="../../images/product/monstardeck/TS115/1.jpg" alt="메인 제품 이미지">
                    </div>
                    <div class="thumbnail-images">
                        <img src="../../images/product/monstardeck/TS115/2.jpg" alt="썸네일2" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/3.jpg" alt="썸네일3" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/4.jpg" alt="썸네일4" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/5.jpg" alt="썸네일5" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/6.jpg" alt="썸네일6" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/7.jpg" alt="썸네일7" onclick="changeImage(this)">
                        <img src="../../images/product/monstardeck/TS115/8.jpg" alt="썸네일8" onclick="changeImage(this)">
                    </div>
                </div>

                <!-- 텍스트 & 액션 -->
                <div class="product-info">
                    <h2 class="product-title">몬스타덱 TS115</h2>
                    <p class="product-price">₩90,000</p>
                    <p class="product-description">
                        나만의 작업 환경을 완성하는 <strong>몬스타덱</strong>입니다.<br>
                        15개의 LCD 키에 원하는 기능과 단축키를 자유롭게 설정하고,<br>
                        원터치 조작으로 반복적인 작업을 더욱 빠르고 편리하게 실행할 수 있습니다.
                    </p>

                    <div class="product-options">
                        <label for="switch-type">몬스타덱</label>
                        <select id="switch-type" name="switch-type">
                            <option value="TS115">TS115</option>
                        </select>
                    </div>

                    <div class="product-actions">
                        <button class="btn-cart" type="button">장바구니 담기</button>
                        <button class="btn-pay" type="button" >바로 구매하기</button>
                    </div>
                </div>
            </div>

            <!-- ▣ 상세페이지 이미지 (하단 전체 이미지) -->
            <div class="product-description-image">
                <div style="text-align: center;">

                    <img src="https://monstar.diskn.com/F84hFHb4t2"><br>
                    <img src="https://monstar.diskn.com/G84hFHaM1Q"><br>
                    <img src="https://monstar.diskn.com/j84hFHaVUV">
                    
                    </div>
            </div>
        </section>

        <!-- ▣ FOOTER -->
        <div id="footer">
            <div class="link_address">
                <p class="footer_address">이 작업물은 몬스타기어 근무 기간 중 직접 제작에 참여한 결과물이며,</p>
                <p class="footer_address">포트폴리오 용도로 제작되었습니다.</p>
            </div>
        </div>
    </div>

    <script>
        function changeImage(elem) {
            document.getElementById('mainPreview').src = elem.src;
        }
    </script>
</body>

</html>
