<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1340">
    <title>몬스타기어 | 제품 상세페이지</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="../../../images/favicon.png">
    <!-- webfont -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+KR:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- 통합 CSS -->
    <link rel="stylesheet" href="../../../css/product/product01.css">
</head>

<body>
    <div id="wrap">
        <!-- ▣ HEADER -->
        <div id="header">
            <div class="header_inner">
                <h1 class="logo">
                    <a href="../../index.html">
                        <img src="../../../images/main_imges/monstargear.png" alt="몬스타기어 로고">
                    </a>
                </h1>

                <nav id="nav">
                    <ul class="gnb">
                        <li><a href="../sub_01.html" class="active">제품 상세페이지</a></li>
                        <li><a href="../sub_02.html">패키지디자인</a></li>
                        <li><a href="../sub_03.html">배너디자인</a></li>
                        <li><a href="../sub_04.html">유튜브 썸네일</a></li>
                        <li><a href="../sub_05.html">기사 썸네일</a></li>
                    </ul>
                </nav>
            </div>
        </div>


        <!-- THUMBNAIL GALLERY -->
        <section class="product-showcase" aria-labelledby="gallery-title">
            <div class="section-heading">
                <div>
                    <p class="section-number">01 / PRODUCT IMAGES</p>
                    <h3 id="gallery-title">제품 썸네일</h3>
                </div>
            </div>

            <div class="gallery-layout">
                <div class="main-image">
                    <img id="mainPreview" src="../../../images/product/keyboard/스텔라100_세종용포/1.jpg" alt="대표 제품 이미지">
                </div>

                <div class="gallery-side">
                    <div class="gallery-copy">
                        <span>keyboard</span>
                        <strong>스텔라100 세종용포</strong>
                        <p>이미지를 선택하면 크게 볼 수 있습니다.</p>
                    </div>

                    <div class="thumbnail-images" aria-label="제품 이미지 선택">
                        <button type="button" class="thumbnail active" aria-label="제품 이미지 1 선택" aria-pressed="true" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/1.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 2 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/2.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 3 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/3.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 4 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/4.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 5 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/5.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 6 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/6.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 7 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/7.jpg" alt="">
                        </button>
                        <button type="button" class="thumbnail" aria-label="제품 이미지 8 선택" aria-pressed="false" onclick="changeImage(this)">
                            <img src="../../../images/product/keyboard/스텔라100_세종용포/8.jpg" alt="">
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- PRODUCT DESCRIPTION -->
        <section class="detail-section" aria-labelledby="detail-title">
            <div class="section-heading">
                <div>
                    <p class="section-number">02 / DETAIL DESIGN</p>
                    <h3 id="detail-title">상세페이지</h3>
                </div>
            </div>

            <div class="product-description-image">
                <img src="https://monstar.diskn.com/w83SV6GxqW" alt="상세페이지 이미지" loading="lazy">
                <img src="https://monstar.diskn.com/J83SV6GGzF" alt="상세페이지 이미지" loading="lazy">
                <img src="https://monstar.diskn.com/V83SV6GPsD" alt="상세페이지 이미지" loading="lazy">    
            </div>
        </section>


        <!-- ▣ FOOTER -->
        <div id="footer">
            <div class="link_address">
                <p class="footer_address">이 작업물은 몬스타기어 근무 기간 중 직접 제작에 참여한 결과물이며,</p>
                <p class="footer_address">포트폴리오 용도로 제작되었습니다.</p>
            </div>
        </div>
    </div>

    <script>
        function changeImage(button) {
            const preview = document.getElementById('mainPreview');
            const image = button.querySelector('img');

            preview.src = image.src;
            preview.alt = '제품 이미지';

            document.querySelectorAll('.thumbnail').forEach(function (item) {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });

            button.classList.add('active');
            button.setAttribute('aria-pressed', 'true');
        }
    </script>
</body>

</html>
