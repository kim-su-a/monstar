                        자유로운 키 설정과 매크로 기능으로 반복 작업을 간편하게 줄이고,<br> 
                        노브와 RGB LED를 더해 실용성과 감각적인 디자인을 모두 갖췄습니다.
                    </p>

                    <div class="product-options">
                        <label for="switch-type">매크로패드</label>
                        <select id="switch-type" name="switch-type">
                            <option value="MK8N2">MK8N2</option>
                        </select>
                    </div>

                    <div class="product-actions">
                        <button class="btn-cart" type="button">장바구니 담기</button>

                    </div>
